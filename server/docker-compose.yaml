version: '3.8'

services:
  # MariaDBサービス
  db:
    image: mariadb:10.11
    container_name: game_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_DATABASE: game_db_test
      MYSQL_USER: game_user
      MYSQL_PASSWORD: game_password_here
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # アプリサーバーサービス
  app:
    build: .
    container_name: game_app
    restart: always
    ports:
      - "2567:2567"
    environment:
      - DB_HOST=db
      - DB_USER=game_user
      - DB_PASSWORD=game_password_here
      - DB_NAME=game_db_test
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules
    command: npm start

volumes:
  db_data: